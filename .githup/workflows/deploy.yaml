name: Deploy Spring Boot to Azure ACR

#bắt bầu bắt sự kiện khi code thay đổi
on:
  push:
    branches:
      - main #tên nhánh(nhánh khác thì đổi tên)
#tự động
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest #máy ảo
    #download code mới về máy ảo
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven #tăng tốc độ build cho lâần sau
      #đóng thành jar
      - name: Build with Maven
        run: mvn clean package -DskipTests
      #đăng nhập az
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        #đóng gói image rooif push lên kho ACR
      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/ecom-backend:${{ github.sha }}
          
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG